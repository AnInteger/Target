<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 G · 柔彩仪表盘 v2（参照图结构复刻）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @property --p { syntax: '<number>'; inherits: false; initial-value: 0; }
  :root {
    --font: "Inter", "SF Pro Display", "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --lime: #b5e550;
    --ink: #17181c;        /* gray-900 略冷 */
    /* 8pt 间距节奏 */
    --sp-page: 24px;       /* 页边距 px-6 */
    --sp-module: 20px;     /* 模块间距 mb-5 */
    --sp-card: 16px;       /* 卡内边距 p-4 */
    --sp-sub: 12px;        /* 子元素 mb-3 */
    --sp-micro: 8px;       /* 微间距 gap-2 */
  }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    background: #17131f;
    display: flex; flex-wrap: wrap; gap: 44px;
    justify-content: center; align-items: flex-start;
    padding: 44px 24px;
  }
  .board-label {
    width: 100%; text-align: center; color: #d8d2e4;
    font: 600 13px/1.6 var(--font); letter-spacing: .14em;
  }

  /* ============ 底幕：页面渐变（参照 index.css 四段） ============ */
  .stage-light, .stage-dark {
    padding: 44px; border-radius: 72px; flex: none;
  }
  .stage-light { background: linear-gradient(135deg, #f5e6f5 0%, #ede0f8 40%, #ddd0f0 70%, #ccc0e8 100%); }
  .stage-dark  { background: linear-gradient(135deg, #2c2036 0%, #241b30 40%, #1a1526 70%, #120e1c 100%); }

  /* ============ 手机：玻璃壳浮在底幕上（核心结构） ============ */
  .phone {
    width: 390px; height: 844px; border-radius: 44px; overflow: hidden;
    position: relative; display: flex; flex-direction: column;
    box-shadow: 0 30px 70px rgba(40, 20, 60, .35);
    flex: none;
  }
  .phone.light {
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  }
  .phone.dark {
    background: rgba(20,16,28,.55);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 30px 70px rgba(0,0,0,.6);
  }
  .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 112px; height: 32px; border-radius: 20px; background: #000; z-index: 20;
  }

  .statusbar {
    height: 52px; flex: none; display: flex; align-items: flex-end;
    justify-content: space-between; padding: 0 28px 6px;
    font: 600 14px/1 var(--font);
  }
  .light .statusbar { color: var(--ink); }
  .dark  .statusbar { color: #f2eff7; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; font: 600 11px/1 var(--font); letter-spacing: .04em; }

  .content {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding-bottom: var(--sp-page); scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ---------- 顶栏：头像 + 问候 + 双层级按钮 ---------- */
  .topbar {
    display: flex; align-items: center; gap: var(--sp-micro);
    padding: var(--sp-micro) var(--sp-page) 0;
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #fcd34d, #fb923c);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 17px/1 var(--font);
  }
  .greet { flex: 1; min-width: 0; }
  .greet .hi  { font: 600 16px/1.25 var(--font); }
  .greet .who { font: 400 14px/1.35 var(--font); }
  .light .greet .hi { color: var(--ink); }
  .light .greet .who { color: #6b7280; }
  .dark  .greet .hi { color: #f2eff7; }
  .dark  .greet .who { color: #a9a4b8; }
  .btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; flex: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .25s ease, opacity .25s ease;
  }
  .btn:active { transform: scale(.88); }
  .btn svg { width: 18px; height: 18px; }
  /* 主操作：黑实心（仅 新建） */
  .light .btn-primary { background: var(--ink); color: #fff; box-shadow: 0 4px 12px rgba(23,24,28,.3); }
  .dark  .btn-primary { background: #f2eff7; color: #1a1622; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  /* 次操作：白底描边（铃铛/更多） */
  .light .btn-ghost { background: #fff; color: #4b5563; border: 1px solid #e5e7eb; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .dark  .btn-ghost { background: rgba(255,255,255,.1); color: #c6bfda; border: 1px solid rgba(255,255,255,.14); }
  .btn-ghost .dot { position: relative; }
  .btn-ghost .dot::after {
    content: ""; position: absolute; top: -12px; right: -10px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #f87171; border: 1.5px solid #fff;
  }
  .dark .btn-ghost .dot::after { border-color: #2a2436; }

  /* ---------- 编辑级 display 大标题（36/800 两行） ---------- */
  .display {
    font: 800 36px/1.22 var(--font); letter-spacing: -.02em;
    padding: var(--sp-module) var(--sp-page) var(--sp-module);
  }
  .light .display { color: var(--ink); }
  .dark  .display { color: #f6f3fb; }

  /* ---------- 深色进度主卡 ---------- */
  .hero {
    margin: 0 var(--sp-page) var(--sp-module);
    border-radius: 16px; padding: var(--sp-card);
    background: #17181c;
    box-shadow: 0 10px 28px rgba(23,24,28,.35);
    transition: box-shadow .4s ease, transform .26s ease;
  }
  .dark .hero { background: #0d0b14; border: 1px solid rgba(255,255,255,.07); box-shadow: 0 10px 28px rgba(0,0,0,.5); }
  .hero.all-complete { box-shadow: 0 10px 32px rgba(181,229,80,.45); }
  .hero-title { font: 600 14px/1 var(--font); color: #9ca3af; margin-bottom: var(--sp-sub); }
  .hero-body { display: flex; align-items: center; gap: var(--sp-module); }
  .ring-wrap { flex: none; width: 110px; height: 110px; position: relative; }
  .ring-wrap svg { display: block; }
  .ring-track { stroke: #3a3a3e; }
  .ring-bar {
    stroke: var(--lime); stroke-linecap: round;
    transition: stroke-dasharray 1s ease-in-out;
  }
  .ring-pct {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
  }
  .ring-pct b { font: 700 18px/1 var(--font); font-variant-numeric: tabular-nums; }
  .ring-pct span { font: 400 10px/1 var(--font); color: #9ca3af; margin-top: 3px; }
  .hero-stats { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .stat { display: flex; align-items: center; gap: var(--sp-micro); }
  .stat svg { width: 14px; height: 14px; color: #6b7280; flex: none; }
  .stat b { font: 600 13px/1 var(--font); color: #e5e7eb; font-variant-numeric: tabular-nums; min-width: 16px; }
  .stat span { font: 400 12px/1 var(--font); color: #9ca3af; }
  .hero-cheer { font: 400 12px/1.5 var(--font); color: var(--lime); margin-top: var(--sp-micro); min-height: 18px; }

  /* ---------- 区块标题 ---------- */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 var(--sp-page); margin-bottom: var(--sp-sub);
  }
  .section-head h2 { font: 700 16px/1 var(--font); }
  .light .section-head h2 { color: var(--ink); }
  .dark  .section-head h2 { color: #f2eff7; }
  .section-head a { font: 400 14px/1 var(--font); text-decoration: none; }
  .light .section-head a { color: #6b7280; }
  .dark  .section-head a { color: #bcb6cf; }

  /* ---------- 状态胶囊（计数在前，数据承载） ---------- */
  .pills { display: flex; gap: var(--sp-micro); padding: 0 var(--sp-page); margin-bottom: var(--sp-card); }
  .pill {
    display: flex; align-items: center; gap: 6px;
    border-radius: 999px; padding: 8px 16px;
    font: 500 14px/1 var(--font); border: none; cursor: pointer;
    transition: all .25s ease;
  }
  .pill b { font-weight: 700; }
  .light .pill { background: rgba(255,255,255,.85); border: 1px solid #e5e7eb; color: #4b5563; }
  .dark  .pill { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.12); color: #c6bfda; }
  .pill.on-lime { background: var(--lime); border-color: var(--lime); color: #24280f; }
  .pill.on-ink  { background: var(--ink); border-color: var(--ink); color: #fff; }
  .dark .pill.on-ink { background: #f2eff7; color: #1a1622; border-color: #f2eff7; }

  /* ---------- 目标卡（参照解剖：圆点行→标题→时间+操作行） ---------- */
  .cards { display: grid; gap: var(--sp-card); padding: 0 var(--sp-page); }
  .card {
    border-radius: 16px; padding: var(--sp-card);
    display: flex; flex-direction: column; gap: var(--sp-sub);
    cursor: pointer;
    transition: box-shadow .3s ease, transform .3s ease, opacity .3s ease, background .3s ease;
  }
  .light .card {
    background: rgba(255,255,255,.8);
    border: 1px solid rgba(229,231,235,.8);
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .dark .card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 2px 10px rgba(0,0,0,.22);
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(40,20,60,.14); }
  .dark .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .card.is-busy { opacity: .55; }
  .card .row1 { display: flex; align-items: center; gap: 6px; }
  .card .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.c-meal  { background: #f87171; }
  .dot.c-fit   { background: #34d399; }
  .dot.c-sleep { background: #a78bfa; }
  .dot.c-read  { background: #fbbf24; }
  .card .cat { font: 500 12px/1 var(--font); }
  .light .card .cat { color: #6b7280; }
  .dark  .card .cat { color: #a9a4b8; }
  .card .card-arrow {
    margin-left: auto; border: none; background: none; cursor: pointer;
    color: #9ca3af; display: flex; padding: 2px;
  }
  .card .card-arrow svg { width: 14px; height: 14px; }
  .card .title { font: 700 16px/1.3 var(--font); }
  .light .card .title { color: var(--ink); }
  .dark  .card .title { color: #f6f3fb; }
  .card.done .title { color: #6aa0f0; }
  .dark .card.done .title { color: #9fc0f5; }
  .card .row3 { display: flex; align-items: center; gap: 10px; }
  .card .row3 .when { display: flex; align-items: center; gap: 5px; font: 400 12px/1 var(--font); }
  .card .row3 .when svg { width: 13px; height: 13px; }
  .light .card .row3 .when { color: #9ca3af; }
  .dark  .card .row3 .when { color: #8f88a3; }
  .card .row3 .count { font: 400 12px/1 var(--font); }
  .light .card .row3 .count { color: #6b7280; }
  .dark  .card .row3 .count { color: #a9a4b8; }
  .card .row3 .count b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .light .card .row3 .count b { color: var(--ink); }
  .dark  .card .row3 .count b { color: #f2eff7; }
  /* 进度点（替代头像簇位置） */
  .pips { display: flex; gap: 6px; margin-left: 4px; }
  .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(0,0,0,.12); transition: background .3s ease, transform .3s ease;
  }
  .dark .pip { background: rgba(255,255,255,.18); }
  .pip.fill { background: var(--lime); transform: scale(1.05); }
  /* 打卡钮：主操作语言（黑实心 36px，完成→青柠） */
  .check {
    margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: none; flex: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: var(--ink); color: #fff;
    box-shadow: 0 3px 10px rgba(23,24,28,.28);
    transition: background .3s ease, transform .2s ease;
  }
  .dark .check { background: #f2eff7; color: #1a1622; box-shadow: 0 3px 10px rgba(0,0,0,.45); }
  .check:active { transform: scale(.85); }
  .check svg { width: 16px; height: 16px; }
  .check .plus { display: block; }
  .check .tickmark { display: none; }
  .card.done .check { background: var(--lime); color: #24280f; box-shadow: 0 3px 10px rgba(181,229,80,.5); }
  .card.done .check .plus { display: none; }
  .card.done .check .tickmark { display: block; }

  /* ---------- 年度时间带卡 ---------- */
  .year-card {
    margin: var(--sp-module) var(--sp-page) 0;
    border-radius: 16px; padding: var(--sp-card);
  }
  .light .year-card { background: rgba(255,255,255,.8); border: 1px solid rgba(229,231,235,.8); box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .dark  .year-card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.09); box-shadow: 0 2px 10px rgba(0,0,0,.22); }
  .year-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--sp-sub); }
  .year-head .t { font: 700 16px/1 var(--font); }
  .light .year-head .t { color: var(--ink); }
  .dark  .year-head .t { color: #f2eff7; }
  .year-head .n { font: 400 12px/1 var(--font); }
  .light .year-head .n { color: #6b7280; }
  .dark  .year-head .n { color: #a9a4b8; }
  .year-band { display: flex; gap: 1.5px; align-items: flex-end; height: 32px; }
  .tick {
    flex: 1; height: 10px; border-radius: 1px;
    background: rgba(0,0,0,.09);
    transition: height .3s ease, background .3s ease;
  }
  .dark .tick { background: rgba(255,255,255,.12); }
  .tick.ok { background: #a8d8a0; height: 20px; }
  .dark .tick.ok { background: #7bbd7b; }
  .tick.today { background: var(--ink); height: 32px; }
  .dark .tick.today { background: #f2eff7; }
  .year-legend { display: flex; gap: 14px; margin-top: var(--sp-sub); font: 400 10px/1 var(--font); color: #9ca3af; align-items: center; }
  .year-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
  .year-legend .l1 i { background: #a8d8a0; }
  .dark  .year-legend .l1 i { background: #7bbd7b; }
  .year-legend .l2 i { background: rgba(0,0,0,.12); }
  .dark  .year-legend .l2 i { background: rgba(255,255,255,.16); }
  .year-legend .l3 i { background: var(--ink); }
  .dark  .year-legend .l3 i { background: #f2eff7; }

  /* ---------- 底部导航：半透明 + 发丝线 ---------- */
  .tabbar {
    flex: none; display: flex; justify-content: space-around; align-items: center;
    padding: 10px 16px 22px;
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid rgba(229,231,235,.9);
  }
  .dark .tabbar {
    background: rgba(24,20,34,.75);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font: 500 11px/1 var(--font); color: #9ca3af; cursor: pointer;
    border: none; background: none; padding: 6px 12px; border-radius: 14px;
    transition: color .25s ease;
  }
  .tab svg { width: 22px; height: 22px; }
  .light .tab.on { color: var(--ink); }
  .dark  .tab.on { color: #f2eff7; }

  /* ---------- 演示控制条 ---------- */
  .demo-bar {
    flex: none; display: flex; gap: var(--sp-micro); padding: 8px var(--sp-page) 12px;
    font: 500 11px/1 var(--font);
  }
  .demo-bar button {
    border: none; border-radius: 999px; padding: 7px 14px;
    font: 500 11px/1 var(--font); cursor: pointer;
    background: rgba(23,24,28,.07); color: #52525b;
    transition: background .25s ease;
  }
  .dark .demo-bar button { background: rgba(255,255,255,.1); color: #c6bfda; }
  .demo-bar button:hover { background: rgba(23,24,28,.14); }
  .dark .demo-bar button:hover { background: rgba(255,255,255,.18); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <p class="board-label">方向 G v2 · 柔彩仪表盘——参照图结构级复刻（玻璃壳 / 36px display / 110px 青柠圆环 / 计数状态胶囊 / 8pt 网格）<br>左：浅色；右：深色适配</p>

  <!-- 卡片模板由 JS 生成，两台手机结构一致 -->
  <template id="tpl">
    <div class="statusbar"><span>9:41</span><span class="icons">▮▮▮ ⌁ 84%</span></div>
    <div class="island"></div>
    <div class="content">
      <div class="topbar">
        <div class="avatar">星</div>
        <div class="greet">
          <div class="hi">早上好</div>
          <div class="who">星行</div>
        </div>
        <button class="btn btn-primary" aria-label="新建目标">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="btn btn-ghost" aria-label="通知">
          <svg class="dot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>

      <h1 class="display">把今天<br>照顾好</h1>

      <div class="hero" data-hero>
        <div class="hero-title">今日进度</div>
        <div class="hero-body">
          <div class="ring-wrap" data-ring>
            <svg width="110" height="110" viewBox="0 0 110 110">
              <circle class="ring-track" cx="55" cy="55" r="44" fill="none" stroke-width="10"/>
              <circle class="ring-bar" data-ringbar cx="55" cy="55" r="44" fill="none" stroke-width="10"
                      stroke-dasharray="0 276.5" transform="rotate(-90 55 55)"/>
            </svg>
            <div class="ring-pct"><b data-pct>0%</b><span>完成率</span></div>
          </div>
          <div class="hero-stats">
            <div class="stat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <b data-total>0</b><span>总次数</span>
            </div>
            <div class="stat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <b data-done>0</b><span>已完成</span>
            </div>
            <div class="stat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <b data-todo>0</b><span>待打卡</span>
            </div>
            <div class="hero-cheer" data-cheer></div>
          </div>
        </div>
      </div>

      <div class="section-head">
        <h2>今日目标</h2><a href="javascript:void(0)">查看全部</a>
      </div>
      <div class="pills">
        <button class="pill on-lime" data-pill="todo"><b>5</b> 待打卡</button>
        <button class="pill" data-pill="done"><b>0</b> 已完成</button>
      </div>
      <div class="cards" data-cards></div>

      <div class="year-card">
        <div class="year-head">
          <span class="t">年度守护</span>
          <span class="n">今年还剩 <span data-left>135</span> 天</span>
        </div>
        <div class="year-band" data-year></div>
        <div class="year-legend">
          <span class="l1"><i></i>达成日</span>
          <span class="l2"><i></i>未达成</span>
          <span class="l3"><i></i>今天</span>
        </div>
      </div>
    </div>
    <div class="demo-bar">
      <button data-act="busy">切换忙碌模式</button>
      <button data-act="reset">重置</button>
    </div>
    <div class="tabbar">
      <button class="tab on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        今日
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="8.5" r="1.4" fill="currentColor" stroke="none"/><path d="M12 12v5M12 11.5l-3.4 2M12 11.5l3.4 2"/></svg>
        目标
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        周回顾
      </button>
      <button class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        我的
      </button>
    </div>
  </template>

  <div class="stage-light"><div class="phone light" data-phone="light"></div></div>
  <div class="stage-dark"><div class="phone dark" data-phone="dark"></div></div>

<script>
  // ---- 演示数据（与 A–F/G v1 同构，便于横向对比） ----
  const GOALS = [
    { key: 'meal',  title: '好好吃饭',   cat: '健康饮食', cls: 'c-meal',  target: 3, time: '8:00' },
    { key: 'fit',   title: '规律运动',   cat: '身体活力', cls: 'c-fit',   target: 3, time: '18:30' },
    { key: 'sleep', title: '23点前上床', cat: '规律作息', cls: 'c-sleep', target: 1, time: '22:50' },
    { key: 'read',  title: '读20页书',   cat: '个人成长', cls: 'c-read',  target: 1, time: '21:00' },
  ];
  let INIT = { meal: 2, fit: 1, sleep: 0, read: 0 };
  let BUSY_TARGET = { meal: 1 };
  let state, busy;
  const TODAY = 229; // 0-based：8月19日 = 第230天
  const TOTAL_DAYS = 365;
  const RING_CIRC = 2 * Math.PI * 44; // ≈276.46

  function reset() { state = { ...INIT }; busy = false; }
  function yearOk(i) { return (i * 7919 + 13) % 97 < 62; }

  function scaffold(phone) {
    phone.innerHTML = document.getElementById('tpl').innerHTML;
    // 年度时间带
    const band = phone.querySelector('[data-year]');
    for (let i = 0; i < TOTAL_DAYS; i++) {
      const t = document.createElement('i');
      t.className = 'tick' + (i === TODAY ? ' today' : (i < TODAY && yearOk(i) ? ' ok' : ''));
      band.appendChild(t);
    }
    // 目标卡
    const wrap = phone.querySelector('[data-cards]');
    GOALS.forEach(g => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.key = g.key;
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `${g.title}，打卡`);
      card.innerHTML = `
        <div class="row1">
          <span class="dot ${g.cls}"></span>
          <span class="cat" data-cat>${g.cat}</span>
          <button class="card-arrow" aria-label="${g.title} 详情" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/></svg>
          </button>
        </div>
        <div class="title">${g.title}</div>
        <div class="row3">
          <span class="when">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${g.time}
          </span>
          <span class="count">已完成 <b data-count>0</b>/${g.target}</span>
          <span class="pips">${'<i class="pip"></i>'.repeat(g.target)}</span>
          <button class="check" aria-label="${g.title} 打卡">
            <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <svg class="tickmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>`;
      const doCheck = () => {
        const tgt = busy ? (BUSY_TARGET[g.key] ?? g.target) : g.target;
        if (state[g.key] >= tgt) return;
        state[g.key]++;
        render(phone);
        if (state[g.key] >= tgt) {
          const hero = phone.querySelector('[data-hero]');
          hero.style.transform = 'scale(1.015)';
          setTimeout(() => { hero.style.transform = ''; }, 260);
        }
      };
      card.addEventListener('click', e => {
        if (e.target.closest('.card-arrow')) return; // 详情钮不触发打卡
        doCheck();
      });
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doCheck(); }
      });
      wrap.appendChild(card);
    });
  }

  function render(phone) {
    let doneSum = 0, totalSum = 0, doneGoals = 0;
    phone.querySelectorAll('[data-cards] .card').forEach(card => {
      const g = GOALS.find(x => x.key === card.dataset.key);
      const tgt = busy ? (BUSY_TARGET[g.key] ?? g.target) : g.target;
      const cur = Math.min(state[g.key], tgt);
      const isDone = cur >= tgt;
      const isBusyDown = busy && g.target > tgt;
      doneSum += cur; totalSum += tgt;
      if (isDone) doneGoals++;
      card.classList.toggle('done', isDone);
      card.classList.toggle('is-busy', isBusyDown && !isDone);
      card.querySelector('[data-count]').textContent = cur;
      card.querySelectorAll('.pip').forEach((p, i) => {
        p.style.display = i < tgt ? '' : 'none';
        p.classList.toggle('fill', i < cur);
      });
      card.querySelector('[data-cat]').textContent = isDone ? '已完成' : (isBusyDown ? '忙碌日 · 降级目标' : g.cat);
    });
    const pct = totalSum ? Math.round(doneSum / totalSum * 100) : 0;
    const allDone = totalSum > 0 && doneSum >= totalSum;
    const bar = phone.querySelector('[data-ringbar]');
    bar.setAttribute('stroke-dasharray', `${(pct / 100 * RING_CIRC).toFixed(1)} ${RING_CIRC.toFixed(1)}`);
    phone.querySelector('[data-pct]').textContent = pct + '%';
    phone.querySelector('[data-total]').textContent = totalSum;
    phone.querySelector('[data-done]').textContent = doneSum;
    phone.querySelector('[data-todo]').textContent = totalSum - doneSum;
    phone.querySelector('[data-hero]').classList.toggle('all-complete', allDone);
    // 状态胶囊计数（数据承载）
    const pTodo = phone.querySelector('[data-pill="todo"]');
    const pDone = phone.querySelector('[data-pill="done"]');
    pTodo.querySelector('b').textContent = totalSum - doneSum;
    pDone.querySelector('b').textContent = doneGoals;
    pTodo.classList.toggle('on-lime', !allDone);
    pTodo.classList.toggle('on-ink', allDone);
    pDone.classList.toggle('on-lime', allDone);
    pDone.classList.remove('on-ink');
    const cheer = phone.querySelector('[data-cheer]');
    if (allDone) cheer.textContent = '今日全部完成，好好休息';
    else if (pct >= 50) cheer.textContent = '过半了，保持节奏';
    else if (doneSum > 0) cheer.textContent = '开个好头';
    else cheer.textContent = '从第一件小事开始';
  }

  document.querySelectorAll('[data-phone]').forEach(phone => {
    reset();
    scaffold(phone);
    // 参照图动效：圆环 0 → N% 入场
    phone.querySelector('[data-ringbar]').setAttribute('stroke-dasharray', `0 ${RING_CIRC.toFixed(1)}`);
    render(phone);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const pct = parseInt(phone.querySelector('[data-pct]').textContent) || 0;
      phone.querySelector('[data-ringbar]').setAttribute('stroke-dasharray',
        `${(pct / 100 * RING_CIRC).toFixed(1)} ${RING_CIRC.toFixed(1)}`);
    }));

    phone.querySelector('[data-act="busy"]').addEventListener('click', () => { busy = !busy; render(phone); });
    phone.querySelector('[data-act="reset"]').addEventListener('click', () => { reset(); render(phone); });
    phone.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => {
      /* 胶囊为筛选演示：切换选中态 */
      const wasOn = p.classList.contains('on-lime') || p.classList.contains('on-ink');
      phone.querySelectorAll('.pill').forEach(x => x.classList.remove('on-lime', 'on-ink'));
      if (!wasOn) p.classList.add('on-lime');
      else render(phone); // 恢复默认选中（待打卡）
    }));
    phone.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
      phone.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      tab.classList.add('on');
    }));
  });
</script>
</body>
</html>
