  /* ============================================================

     - 主流设置式：账号卡 + 分组列表（通知/目标/数据/关于）
     - 行形态：图标 + 标题 + 行尾（值 | 开关 | 箭头）
     - 头部「我的」与今日页账号行 / 回顾页「上周回顾」同带同缩进
       （FR-008 三屏标题对齐基准：第一行左缘 = space-6）
     - 资料编辑 bottom sheet：--scrim 遮罩，不遮底部导航
     - 取值 100% 来自 ../tokens.css（SC-004）
     - 台面（评审环境灰底）与手机外框属呈现 chrome，非屏内设计
     ============================================================ */

  [hidden] { display: none !important; }

  /* ---- 评审台面（与 screen-today / screen-review 同语言） ---- */
  body {
    margin: 0; min-height: 100vh; background: #1b191f;

    display: flex; flex-direction: column; align-items: center;
    padding: var(--space-12) var(--space-6) var(--space-12); box-sizing: border-box;
  }
  .pt-title { font: var(--font-display-m); margin: 0; }
  .pt-sub { font: var(--font-body-m); color: rgba(242, 239, 247, .6);
            margin: var(--space-2) 0 var(--space-8); text-align: center;
            max-width: 640px; line-height: 1.7; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-8); justify-content: center;
         margin-bottom: var(--space-12); }
  .board { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  .board h3 { font: var(--font-title-s); margin: 0; }
  .board .desc { font: var(--font-body-s); color: rgba(242, 239, 247, .55);
                 max-width: 390px; text-align: center; margin: 0; line-height: 1.7; }
  .chips { display: flex; gap: var(--space-1); flex-wrap: wrap; justify-content: center; }
  .chip { font: var(--font-label); padding: var(--space-1) var(--space-2);
          border-radius: var(--radius-full);
          background: rgba(255, 255, 255, .06); color: rgba(242, 239, 247, .7); }
  .chip.t { color: var(--positive-fill); }

  /* ---- 手机外框 ---- */
  .phone {
    position: relative; width: 390px; height: 844px; border-radius: 44px;
    background: linear-gradient(var(--bg-grad-angle), var(--bg-grad-1),
                var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
    box-shadow: var(--shadow-high); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .island { position: absolute; top: var(--space-3); left: 50%;
            transform: translateX(-50%); width: 112px; height: 32px;
            background: #000; border-radius: var(--radius-full); z-index: 40; }
  .st-status { height: 52px; flex: none; display: flex; align-items: flex-end;
               justify-content: space-between; padding: 0 var(--space-6) var(--space-1);
               font: var(--font-body-m); font-weight: 600; color: var(--on-surface); }
  .st-status svg { display: block; }

  /* ---- 头部标题带（FR-008 三屏对齐基准：左缘 space-6、44px 带、
     与今日屏 st-top 同构——min-height 44 + 顶垫 space-2，T004 对齐） ---- */
  .gl-top { flex: none; display: flex; align-items: center; gap: var(--space-3);
            min-height: 44px;
            padding: var(--space-2) var(--space-6) 0; }
  .gl-top .tt { font: var(--font-display-s); color: var(--on-surface); flex: 1; }

  .gl-scroll { flex: 1; overflow-y: auto; scrollbar-width: none;

               display: flex; flex-direction: column; gap: var(--space-2); }
  .gl-scroll::-webkit-scrollbar { display: none; }

  /* ---- 账号卡（今日页左上账号区同源：头像 + 昵称 + 编辑） ---- */
  .me-card {
    background: var(--glass-card); border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg); padding: var(--space-4);
    display: flex; align-items: center; gap: var(--space-3);
    box-shadow: var(--shadow-low); backdrop-filter: var(--glass-blur); }
  .me-avatar { width: 44px; height: 44px; border-radius: var(--radius-full); flex: none;
               display: flex; align-items: center; justify-content: center; }
  .me-avatar.grad { background: linear-gradient(135deg, var(--grad-avatar-a), var(--grad-avatar-b));

  .me-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .me-name { font: var(--font-title-s); color: var(--on-surface); }
  .me-sub { font: var(--font-body-s); color: var(--on-surface-variant); }
  .me-edit { border: 1px solid var(--divider); background: var(--surface); flex: none;
             color: var(--on-surface); font: var(--font-body-m); font-family: var(--font-stack);
             border-radius: var(--radius-full); padding: var(--space-1) var(--space-4);
             cursor: pointer; }
  .me-edit:active { transform: scale(.95); }

  /* ---- 分组小标 + 组卡 ---- */
  .s-sec { font: var(--font-label); letter-spacing: .08em;
           color: var(--on-surface-variant); margin: var(--space-3) 0 var(--space-1); }
  .s-card {
    background: var(--glass-card); border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-low);
    backdrop-filter: var(--glass-blur); overflow: hidden; }
  .s-hint { font: var(--font-body-s); color: var(--on-surface-variant);
            padding: 0 var(--space-1); line-height: 1.6; }

  /* 通用行：图标 + 标题(+副题) + 行尾（值|开关|箭头） */
  .s-row { display: flex; align-items: center; gap: var(--space-3);
           padding: var(--space-3) var(--space-4);
           width: 100%; box-sizing: border-box; text-align: left;
           background: none; border: none; font-family: var(--font-stack); }
  .s-row + .s-row, .s-row + .s-nest, .s-nest + .s-row { border-top: 1px solid var(--divider); }
  button.s-row, .s-row.tap { cursor: pointer; }
  button.s-row:active { background: var(--surface-alt); }
  .s-ico { width: 32px; height: 32px; border-radius: var(--radius-md); flex: none;
           display: flex; align-items: center; justify-content: center;
           background: var(--surface-alt); color: var(--on-surface-variant); }
  .s-ico svg { width: 16px; height: 16px; }
  .s-ico .gi { width: 18px; height: 18px; }
  .s-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .s-title { font: var(--font-body-l); color: var(--on-surface); }
  .s-sub { font: var(--font-body-s); color: var(--on-surface-variant); }
  .s-val { font: var(--font-body-m); color: var(--on-surface); flex: none;
           font-variant-numeric: tabular-nums; font-weight: 700; }
  .chev { flex: none; color: var(--on-surface-variant); display: grid; place-items: center; }
  .chev svg { width: 14px; height: 14px;

  .s-row[aria-expanded="true"] .chev svg { transform: rotate(90deg); }

  /* 按目标提醒 · 二级列表（嵌套浅底） */
  .s-nest { background: var(--surface-alt); }
  .s-nest .s-row { padding-left: var(--space-8); }
  .s-nest .s-ico { background: var(--surface); }

  /* 开关（iOS 胶囊） */
  .sw { position: relative; width: 46px; height: 28px; border-radius: var(--radius-full);
        background: var(--divider); border: none; cursor: pointer; flex: none;
        transition: background var(--motion-fast) var(--ease-standard); }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px;

               transition: transform var(--motion-base) var(--ease-standard); }
  .sw.on { background: var(--positive-fill); }
  .sw.on::after { transform: translateX(18px); }

  /* ---- 资料编辑 bottom sheet（--scrim 遮罩；停在城市导航之上） ---- */
  .st-navwrap, .gl-home { position: relative; z-index: 60; }
  .sheet-mask { position: absolute; inset: 0; z-index: 50; background: var(--scrim);

  .phone.sheet-open .sheet-mask { opacity: 1; pointer-events: auto; }

    padding: var(--space-3) var(--space-5) var(--space-5);
    display: flex; flex-direction: column; gap: var(--space-4);
    transform: translateY(16px); opacity: 0; pointer-events: none;
    transition: transform var(--motion-base) var(--ease-standard),
                opacity var(--motion-base) var(--ease-standard); }
  .phone.sheet-open .sheet { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .phone.freeze .sheet-mask, .phone.freeze .sheet { pointer-events: none; }
  .sheet-grip { width: 36px; height: 4px; border-radius: var(--radius-full);

  .sheet-head { display: flex; align-items: center; justify-content: space-between; }

  .sheet-done { border: none; background: var(--accent); color: var(--accent-on);

                border-radius: var(--radius-full); padding: var(--space-1) var(--space-4);

  .sheet-prev { display: flex; align-items: center; gap: var(--space-4); }
  .sheet-prev .me-avatar { width: 56px; height: 56px; font: var(--font-title-l); }
  .sheet-prev .me-avatar .gi { width: 28px; height: 28px; }
  .nick { flex: 1; min-width: 0; }
  .nick label { display: block; font: var(--font-label); color: var(--on-surface-variant);
                margin-bottom: var(--space-1); }
  .nick input { width: 100%; box-sizing: border-box; border: 1px solid var(--divider);
                background: var(--surface-alt); border-radius: var(--radius-md);
                padding: var(--space-2) var(--space-3); font: var(--font-body-l);
                font-family: var(--font-stack); color: var(--on-surface); }
  .nick input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sheet-avlab { font: var(--font-label); color: var(--on-surface-variant); }
  .sheet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
  .av { aspect-ratio: 1; border-radius: var(--radius-full); border: 1px solid var(--divider);
        cursor: pointer; display: grid; place-items: center;
        transition: transform var(--motion-fast) var(--ease-standard); }
  .av:active { transform: scale(.9); }
  .av .gi { width: 26px; height: 26px; }
  .av.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

  /* ---- 底部导航（三 Tab：今日 / 回顾 / 我的；本屏=我的 选中） ---- */
  .st-navwrap { flex: none; padding: var(--space-2) var(--space-6); }
  .st-nav {
    display: flex; align-items: center;
    background: var(--surface); border-radius: var(--radius-full);
    box-shadow: var(--shadow-mid); padding: var(--space-1);
  }
  .st-tab {
    background: none; border: none; cursor: pointer; padding: var(--space-1) 0;
    flex: 1; /* 等分槽位：选中胶囊变宽不推挤邻页签 */
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--on-surface-variant); font: var(--font-label);
    text-decoration: none; font-family: var(--font-stack);
  }
  .st-tab svg { width: 20px; height: 20px; }
  .st-tab .chipx {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: var(--accent); color: var(--accent-on);
    border-radius: var(--radius-full); padding: var(--space-1) var(--space-4);
  }
  .st-tab .chipx svg { width: 20px; height: 20px; }
  .st-tab .chipx span { line-height: 1; }
  .gl-home { flex: none; height: 28px; display: flex; align-items: center;

  .gl-home i { width: 120px; height: 5px; border-radius: var(--radius-full);

  /* 焦点可见性 */
  .s-row:focus-visible, .sw:focus-visible, .me-edit:focus-visible,
  .sheet-done:focus-visible, .av:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important; transition-duration: 1ms !important;
    }
  }
</style>

          <span class="s-title">版本</span>
        </div>
        <span class="s-val">1.3.0</span>
      </div>
      <div class="s-row">
        <span class="s-ico">
          <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <div class="s-mid">
          <span class="s-title">隐私</span>
          <span class="s-sub">数据只在这台设备上——不上传、不联网，记得定期导出</span>
        </div>
      </div>
    </div>
  </div>

  <div class="st-navwrap">
    <nav class="st-nav">
      <a class="st-tab" href="screen-today.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        今日</a>
      <a class="st-tab" href="screen-review.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 14l3-3 2 2 3-4"/></svg>
        回顾</a>
      <span class="st-tab">
        <span class="chipx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
          <span>我的</span>
        </span>
      </span>
    </nav>
  </div>
  <div class="gl-home"><i></i></div>

  <div class="sheet-mask" data-mask></div>
  <div class="sheet" role="dialog" aria-label="编辑资料">
    <span class="sheet-grip"></span>
    <div class="sheet-head">
      <b>编辑资料</b>
      <button class="sheet-done" type="button" data-done>完成</button>
    </div>
    <div class="sheet-prev">
      <span class="me-avatar grad" data-avatar></span>
      <div class="nick">
        <label for="nick-in">昵称</label>
        <input id="nick-in" type="text" maxlength="12" value="星行" data-nick>
      </div>
    </div>
    <span class="sheet-avlab">选择头像</span>
    <div class="sheet-grid" data-avgrid></div>
  </div>
</template>

<script src="goal-icons.js"></script>
<script>
/* ---------- 演示状态 ---------- */
const NICK = { text: '星行' };           // 默认昵称兜底「我」（T014 文案层）
let selectedAv = null;                   // null = 默认渐变枚 + 昵称首字

/* 8 枚预设头像：图标库取（goal-icons.js）+ 令牌环色（research D7） */
const AV_PRESETS = [
  { key: 'favorite',        ring: 'var(--goal-coral)' },
  { key: 'directions_run',  ring: 'var(--goal-sage)'  },
  { key: 'menu_book',       ring: 'var(--goal-sky)'   },
  { key: 'brush',           ring: 'var(--goal-plum)'  },
  { key: 'flight',          ring: 'var(--goal-teal)'  },
  { key: 'savings',         ring: 'var(--goal-amber)' },
  { key: 'pets',            ring: 'var(--goal-stone)' },
  { key: 'spa',             ring: 'var(--goal-indigo)' },
];

/* 头像渲染：预设 = 环色 16% 底 + 同色图标；默认 = 渐变 + 昵称首字 */
function paintAvatar(el) {
  el.innerHTML = '';
  if (selectedAv) {
    el.className = 'me-avatar';
    el.style.background = `color-mix(in srgb, ${selectedAv.ring} 22%, var(--surface))`;
    el.style.color = selectedAv.ring;
    el.appendChild(gi(selectedAv.key, el.classList.contains('me-avatar') &&
      el.offsetWidth >= 56 ? 28 : 22));
  } else {
    el.className = 'me-avatar grad';
    el.style.background = ''; el.style.color = '';
    el.textContent = (NICK.text || '我').trim().charAt(0) || '我';
  }
}

const BOARDS = [
  { id: 'typical', theme: 'light', freeze: false,
    title: '① 典型 · 可交互',
    desc: '拨开关、展开「按目标提醒」二级列表、点「编辑」弹起资料 sheet——遮罩不盖底部导航，导航仍可点。',
    chips: ['账号卡 + 分组行', '行尾 值|开关|箭头', 'sheet 不遮导航'] },
  { id: 'sheet', theme: 'light', freeze: true, sheetOpen: true,
    title: '② 资料编辑 · 弹起态',
    desc: '昵称即时生效（左上账号卡同步换首字）；8 枚预设头像 = 图标库 + 令牌环色，选中有双环标识。',
    chips: ['bottom sheet', '预设头像 ×8', '昵称即时同步'] },
  { id: 'dark', theme: 'dark', freeze: false,
    title: '③ 深色 · 典型并列',
    desc: '暗紫底幕上玻璃卡与开关同语言；预设头像的环色底由 color-mix 随主题自动加深。',
    chips: ['深色', '令牌自动切换'] },
];

const host = document.getElementById('boards');
for (const cfg of BOARDS) {
  const wrap = document.createElement('section');
  wrap.className = 'board';
  wrap.innerHTML = `<h3>${cfg.title}</h3><p class="desc">${cfg.desc}</p>
    <div class="chips">${cfg.chips.map((c, i) =>
      `<span class="chip${i === 0 ? ' t' : ''}">${c}</span>`).join('')}</div>`;
  const phone = document.createElement('div');
  phone.className = 'phone' + (cfg.freeze ? ' freeze' : '');
  if (cfg.theme === 'dark') phone.setAttribute('data-theme', 'dark');
  phone.appendChild(document.getElementById('tpl').content.cloneNode(true));
  wrap.appendChild(phone);
  host.appendChild(wrap);

  /* data-gi 行首目标图标（按目标提醒二级列表） */
  phone.querySelectorAll('[data-gi]').forEach((s) =>
    s.appendChild(gi(s.dataset.gi, 18)));

  /* 头像初绘 */
  paintAvatar(phone.querySelector('.me-card [data-avatar]'));
  paintAvatar(phone.querySelector('.sheet [data-avatar]'));

  /* 预设头像格 */
  const grid = phone.querySelector('[data-avgrid]');
  AV_PRESETS.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'av'; b.dataset.key = p.key;
    b.setAttribute('aria-label', '头像 ' + p.key);
    b.setAttribute('aria-pressed', selectedAv === p);
    b.style.background = `color-mix(in srgb, ${p.ring} 22%, var(--surface))`;
    b.style.color = p.ring;
    b.appendChild(gi(p.key, 26));
    grid.appendChild(b);
  });

  if (cfg.sheetOpen) phone.classList.add('sheet-open');
  if (cfg.freeze) continue;                       // 定格画板不接交互

  /* 交互：开关 / 展开 / sheet */
  phone.querySelectorAll('.sw').forEach((s) =>
    s.addEventListener('click', () => s.classList.toggle('on')));
  const exp = phone.querySelector('[data-expand]');
  exp.addEventListener('click', () => {
    const nest = phone.querySelector('[data-nest]');
    const open = exp.getAttribute('aria-expanded') === 'true';
    exp.setAttribute('aria-expanded', String(!open));
    nest.hidden = open;
  });
  phone.querySelector('[data-edit]').addEventListener('click', () =>
    phone.classList.add('sheet-open'));
  phone.querySelector('[data-done]').addEventListener('click', () =>
    phone.classList.remove('sheet-open'));
  phone.querySelector('[data-mask]').addEventListener('click', () =>
    phone.classList.remove('sheet-open'));

  const nickIn = phone.querySelector('[data-nick]');
  nickIn.addEventListener('input', () => {
    NICK.text = nickIn.value;
    paintAvatar(phone.querySelector('.me-card [data-avatar]'));
    paintAvatar(phone.querySelector('.sheet [data-avatar]'));
  });
  grid.addEventListener('click', (e) => {
    const b = e.target.closest('.av'); if (!b) return;
    const p = AV_PRESETS.find((x) => x.key === b.dataset.key);
    selectedAv = (selectedAv === p) ? null : p;   // 再点一次 = 回默认枚
    paintAvatar(phone.querySelector('.me-card [data-avatar]'));
    paintAvatar(phone.querySelector('.sheet [data-avatar]'));
    grid.querySelectorAll('.av').forEach((x) => {
      const hit = selectedAv && x.dataset.key === selectedAv.key;
      x.classList.toggle('sel', !!hit);
      x.setAttribute('aria-pressed', String(!!hit));
    });
  });
}
</script>
</body>
</html>
