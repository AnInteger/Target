<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Target 品牌图标 · 候选 A「今日之环」· 浅色母版（T028）
       几何与取值 1:1 派生自 design/brand/icon-proposal.html（markSVG('a','light')）：
       底幕 = tokens.css 的 bg-grad 1..4（135deg）；环身 = accent 浅 #252230；
       今日弧 = positive-fill #b5e550（75°）；记录珠 = goal-indigo 浅 #5b6ab0。
       iOS 资产为不透明全出血方图（系统施加 squircle 蒙版，勿烘焙圆角）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd8e0"/>
      <stop offset="0.3333" stop-color="#e2d3e9"/>
      <stop offset="0.6667" stop-color="#d9d1f2"/>
      <stop offset="1" stop-color="#d1ccf8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="scale(8.5333)">
    <circle cx="60" cy="60" r="34" fill="none" stroke="#252230" stroke-width="14"/>
    <path d="M 60 26 A 34 34 0 0 1 92.8 71.2" fill="none" stroke="#b5e550"
          stroke-width="14" stroke-linecap="round"/>
    <circle cx="94" cy="60" r="9" fill="#5b6ab0"/>
  </g>
</svg>
